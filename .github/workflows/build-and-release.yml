name: Build & Release Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title (optional, e.g. "Cosmo Game Store v1.0.1")'
        required: false
        default: ''
      tag_name:
        description: 'Release Tag (optional, e.g. "v1.0.1" or "latest")'
        required: false
        default: 'latest'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Prepare Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Set up Environment & Keystore
        run: |
          # Ensure .env exists for Secrets Gradle plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Ensure debug.keystore is available
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package & Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Error: APK not found at $APK_SRC"
            exit 1
          fi

          # Output APK name
          OUTPUT_APK="CosmoGameStore-debug.apk"
          cp "$APK_SRC" "$OUTPUT_APK"

          # Calculate SHA-256 checksum
          sha256sum "$OUTPUT_APK" > "$OUTPUT_APK.sha256"
          CHECKSUM=$(cut -d ' ' -f 1 "$OUTPUT_APK.sha256")
          FILE_SIZE=$(du -h "$OUTPUT_APK" | cut -f 1)

          # Determine Tag & Title
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_NUM="${{ github.run_number }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            if [ -z "$TAG" ]; then TAG="latest"; fi
            TITLE="${{ github.event.inputs.release_title }}"
            if [ -z "$TITLE" ]; then TITLE="Cosmo Game Store (Build #$BUILD_NUM - $SHORT_SHA)"; fi
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="Cosmo Game Store $TAG"
          else
            TAG="latest"
            TITLE="Cosmo Game Store (Latest - Build #$BUILD_NUM)"
          fi

          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "sha_path=$OUTPUT_APK.sha256" >> $GITHUB_OUTPUT
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "file_size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Upload Debug APK Artifact (Actions Summary)
        uses: actions/upload-artifact@v4
        with:
          name: CosmoGameStore-debug-apk
          path: |
            CosmoGameStore-debug.apk
            CosmoGameStore-debug.apk.sha256
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.tag }}
          name: ${{ steps.prepare_artifacts.outputs.title }}
          draft: false
          prerelease: false
          make_latest: ${{ steps.prepare_artifacts.outputs.tag == 'latest' }}
          files: |
            ${{ steps.prepare_artifacts.outputs.apk_path }}
            ${{ steps.prepare_artifacts.outputs.sha_path }}
          body: |
            # 🚀 Cosmo Game Store — Debug APK

            Direct download link for **Cosmo Game Store** Android APK.

            ### 📦 Download
            - **[⬇️ Direct Download CosmoGameStore-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare_artifacts.outputs.tag }}/CosmoGameStore-debug.apk)**
            - **File Size:** `${{ steps.prepare_artifacts.outputs.file_size }}`
            - **Build Number:** `#${{ github.run_number }}`
            - **Commit:** `${{ github.sha }}`
            - **SHA-256 Checksum:**
              ```text
              ${{ steps.prepare_artifacts.outputs.checksum }}
              ```

            ---

            ### 📱 What's Included:
            - **Cosmo Store Browser:** Full live web experience (`https://cosmo-game.pages.dev/`)
            - **Native APK/XAPK Downloader & Installer:** Real streaming downloads with official Android package installation
            - **My Library:** Instant play launcher for installed games and storage stats
            - **ForYou Catalog:** Curated game recommendations directly from Cosmo API
            - **Settings:** Storage cleaner, auto-delete APKs, and install permissions management

            ---
            *Built automatically with GitHub Actions.*
